<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Midterms">
<meta name="theme-color" content="#0b0e14">
<title>Midterms 2026</title>
<style>
:root{--bg:#0b0d12;--card:#151922;--line:#262c38;--fg:#e8eaf0;--mut:#8b93a5;--D:#3b82f6;--R:#ef4444;--O:#a3a3a3}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,system-ui,sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 8px) 14px 0;border-bottom:1px solid var(--line)}
.hr{display:flex;align-items:baseline;gap:8px}h1{margin:0;font-size:18px;white-space:nowrap}
#upd{color:var(--mut);font-size:11px;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{display:flex;gap:5px;overflow-x:auto;padding:8px 0;scrollbar-width:none}nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:var(--card);color:var(--mut);border:1px solid var(--line);border-radius:16px;padding:6px 12px;font-size:13px}
nav button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
main{padding:12px 12px calc(env(safe-area-inset-bottom) + 28px)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
h2{font-size:15px;margin:2px 0 8px}h3{font-size:12px;color:var(--mut);margin:16px 2px 6px;text-transform:uppercase;letter-spacing:.05em}
.mut{color:var(--mut);font-size:12px}.err{color:#fca5a5}
.bar{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#2a303c;margin:8px 0 5px}.bar i{display:block;height:100%;flex:none}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px}
.big{font-size:22px;font-weight:700}
.rh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.rh b{font-size:15px}
.stt{font-size:12px;color:var(--mut);text-align:right}.called{color:#4ade80;font-weight:600}
.rt{font-size:11.5px;color:var(--mut);margin:3px 0 6px}.rb{font-weight:600}
.c{display:grid;grid-template-columns:minmax(0,1fr) 60px 46px;gap:8px;align-items:center;font-size:13.5px;padding:3px 0}
.c .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pb{height:6px;border-radius:3px;background:#2a303c;overflow:hidden}.pb i{display:block;height:100%}
.pct{text-align:right;font-variant-numeric:tabular-nums}
details summary{color:var(--mut);font-size:12px;padding-top:3px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tools input{flex:1 1 100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:9px 11px;font-size:16px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:14px;padding:5px 11px;font-size:12.5px}
.chip.on{color:var(--fg);border-color:var(--fg)}
table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}td,th{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:500}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
a{color:#93c5fd}p{margin:0 0 12px}
/*fitfix*/main,main *{overflow-wrap:anywhere;word-break:break-word}main{overflow-x:hidden}main img,main table,main pre{max-width:100%}main pre{white-space:pre-wrap}</style></head><body>
<header><div class="hr"><h1>🗳️ Midterms 2026</h1><span id="upd">Loading…</span></div><nav id="nav"></nav></header>
<main id="main"><div class="card mut">Loading the latest results…</div></main>
<script>
(function(){
try{ if('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())) }catch(e){}
const TABS=[['overview','Overview'],['senate','Senate'],['house','House'],['governor','Governors'],['polls','Polls'],['about','Sources']];
const F=[['all','All'],['comp','Competitive'],['open','Not called'],['called','Called']];
const PC={D:'#3b82f6',R:'#ef4444',I:'#a78bfa',L:'#eab308',G:'#22c55e',O:'#9ca3af'};
const PN={D:'Dem.',R:'Rep.',I:'Ind.',L:'Lib.',G:'Green'};
let D=null,tab='overview',q='',filt='all',busy=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('en-US');
const tm=t=>new Date(t).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
function rcol(s){if(s==null)return 'var(--mut)';if(s>=2)return '#60a5fa';if(s>0)return '#93c5fd';if(s===0)return '#fbbf24';if(s>-2)return '#fca5a5';return '#f87171'}
function rb(l,r){return r?`${l} <span class="rb" style="color:${rcol(r.s)}">${esc(r.t)}</span>`:''}
function comp(x){return [x.nyt,x.ie].some(r=>r&&r.s!=null&&Math.abs(r.s)<=1)}
function nav(){$('#nav').innerHTML=TABS.map(([k,l])=>`<button data-t="${k}" class="${k===tab?'on':''}">${l}</button>`).join('')}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;q='';filt='all';nav();render();window.scrollTo(0,0)};
function upd(){const age=(Date.now()/1000-D.built)/60;$('#upd').textContent='Updated '+tm(D.built*1000)+(age>45?' · may be out of date':'')}
function cand(c){const col=PC[c.p]||PC.O,pl=PN[c.p]||c.pn||'Other';
 return `<div class="c"><span class="nm">${c.w?'✓ ':''}${esc(c.n)} <span class="mut">${esc(pl)}${c.inc?' · inc.':''}${c.v?' · '+fmt(c.v):''}</span></span><span class="pb"><i style="width:${c.pct||0}%;background:${col}"></i></span><span class="pct">${c.pct!=null?c.pct.toFixed(1)+'%':'–'}</span></div>`}
function stat(x){
 if(x.winner){const w=x.cands.find(c=>c.w);return `<span class="called">✓ ${esc(w?w.n:'Called')}</span>`}
 let s=esc(x.status||'');
 if(x.eevp>0) s+=` · ${Math.min(100,Math.round(x.eevp))}% in`;
 else if(x.close&&new Date(x.close)>new Date()) s='Polls close '+tm(x.close);
 return s}
function raceCard(x,pre){
 const cs=x.cands||[],rt=[rb('NYT:',x.nyt),rb('Inside Elections:',x.ie)].filter(Boolean).join(' · ');
 return `<div class="card"><div class="rh"><b>${esc((pre||'')+x.label)}</b><span class="stt">${stat(x)}</span></div>${rt?`<div class="rt">${rt}</div>`:''}${x.unc?'<div class="mut">Uncontested</div>':''}${cs.slice(0,3).map(cand).join('')}${cs.length>3?`<details><summary>${cs.length-3} more candidate${cs.length>4?'s':''}</summary>${cs.slice(3).map(cand).join('')}</details>`:''}</div>`}
function chamber(k,title){
 const o=(D.offices||{})[k];
 if(!o) return `<div class="card"><h2>${title}</h2><div class="mut">Not available right now.</div></div>`;
 const n=o.races.length,w=o.won||{},d=w.D||0,r=w.R||0,x=w.O||0,tw=(o.control||{}).to_win||{},pc=v=>n?(100*v/n).toFixed(2)+'%':'0';
 let maj='';
 if(k!=='governor'&&(tw.DEM||tw.GOP)) maj=` Majority: ${tw.DEM} seats for Democrats, ${tw.GOP} for Republicans${k==='senate'?' (including seats not up this year; the Vice President breaks ties)':''}.`;
 return `<div class="card"><h2>${title} <span class="mut">· ${n} races</span></h2><div class="row"><span><span class="big" style="color:var(--D)">${d}</span> Dem.</span><span class="mut">${o.called||0} of ${n} called</span><span>Rep. <span class="big" style="color:var(--R)">${r}</span></span></div><div class="bar"><i style="width:${pc(d)};background:var(--D)"></i><i style="width:${pc(x)};background:var(--O)"></i><span style="flex:1"></span><i style="width:${pc(r)};background:var(--R)"></i></div><div class="mut">Races won so far${x?` · others: ${x}`:''}.${maj}</div></div>`}
function overview(){
 const O=D.offices||{},P=D.polls||{},g=P.generic&&P.generic.avg,a=P.approval&&P.approval.avg;
 let h=chamber('senate','Senate')+chamber('house','House')+chamber('governor','Governors');
 if(g||a) h+=`<div class="card"><h2>Polls by news organisations</h2>${g?`<div class="row"><span>Congress (generic ballot)</span><span><b style="color:var(--D)">D ${g.d.toFixed(1)}</b> · <b style="color:var(--R)">R ${g.r.toFixed(1)}</b></span></div>`:''}${a?`<div class="row"><span>Trump approval</span><span><b>${a.ap.toFixed(1)}%</b> approve · ${a.dis.toFixed(1)}% disapprove</span></div>`:''}<div class="mut">Details in the Polls tab.</div></div>`;
 const watch=['senate','governor'].flatMap(k=>(O[k]?O[k].races:[]).filter(comp).map(x=>[k,x]));
 if(watch.length) h+='<h3>Races to watch</h3>'+watch.map(([k,x])=>raceCard(x,k==='governor'?'Governor · ':'Senate · ')).join('');
 const hc=O.house?O.house.races.filter(comp).length:0;
 if(hc) h+=`<div class="card mut">${hc} competitive House races: open the House tab and tap “Competitive”.</div>`;
 if(D.errors&&D.errors.length) h+=`<div class="card mut">Not updated this time: ${esc(D.errors.join('; '))}</div>`;
 return h}
function tools(){return `<div class="tools"><input id="q" type="search" placeholder="Search a state or candidate" value="${esc(q)}" autocomplete="off">${F.map(([k,l])=>`<button class="chip${k===filt?' on':''}" data-f="${k}">${l}</button>`).join('')}</div><div id="list"></div>`}
function bindTools(){$('#q').oninput=e=>{q=e.target.value;fill()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{filt=b.dataset.f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));fill()})}
function fill(){
 const o=(D.offices||{})[tab],L=$('#list');if(!L)return;
 if(!o){L.innerHTML='<div class="card err">These results are not available right now. They should appear on the next update.</div>';return}
 const ql=q.trim().toLowerCase();
 const rs=o.races.filter(x=>(filt==='all'||(filt==='comp'&&comp(x))||(filt==='called'&&!!x.winner)||(filt==='open'&&!x.winner))&&(!ql||(x.label+' '+x.sn+' '+x.st+' '+x.cands.map(c=>c.n).join(' ')).toLowerCase().includes(ql)));
 L.innerHTML=`<div class="mut" style="margin:0 2px 8px">${rs.length} of ${o.races.length} races · ${o.called||0} called</div>`+(rs.length?rs.map(x=>raceCard(x)).join(''):'<div class="card mut">No races match.</div>')}
function pollSec(title,P,kx,ky,lx,ly){
 if(!P||!P.polls||!P.polls.length) return `<div class="card"><h2>${title}</h2><div class="mut">No recent polls by news organisations.</div></div>`;
 const a=P.avg;
 return `<div class="card"><h2>${title}</h2>${a?`<div class="row"><span>${lx} <span class="big">${a[kx].toFixed(1)}%</span></span><span>${ly} <span class="big">${a[ky].toFixed(1)}%</span></span></div><div class="mut">Average of ${a.n} poll${a.n>1?'s':''} (latest from each news organisation), ${esc(a.from)} to ${esc(a.to)}</div>`:''}<table><tr><th>Poll</th><th>Ended</th><th class="n">${lx}</th><th class="n">${ly}</th></tr>${P.polls.map(p=>`<tr><td>${p.url?`<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.who)}</a>`:esc(p.who)}</td><td>${esc((p.end||'').slice(5))}</td><td class="n">${p[kx]}</td><td class="n">${p[ky]}</td></tr>`).join('')}</table></div>`}
function pollsTab(){const P=D.polls||{};return pollSec('Congress: generic ballot',P.generic,'d','r','Dem.','Rep.')+pollSec('Trump approval',P.approval,'ap','dis','Approve','Disapprove')}
function about(){
 return `<div class="card"><h2>Where the numbers come from</h2>${(D.sources||[]).map(s=>`<p><b>${esc(s.name)}</b><br><span class="mut">${esc(s.what)}</span><br><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(String(s.url).replace(/^https?:\/\//,''))}</a></p>`).join('')}<p class="mut">No betting or prediction markets are used. Race calls are shown as The New York Times publishes them. The data refreshes about every 15 minutes.</p><p class="mut">Last update: ${esc(new Date(D.built*1000).toLocaleString())}</p></div>`}
function render(){
 if(!D)return;
 try{upd();const m=$('#main');
  if(tab==='overview')m.innerHTML=overview();else if(tab==='polls')m.innerHTML=pollsTab();else if(tab==='about')m.innerHTML=about();
  else{m.innerHTML=tools();bindTools();fill()}
 }catch(e){$('#main').innerHTML='<div class="card err">Display error: '+esc(e.message)+'</div>';console.error(e)}}
async function load(){
 if(busy)return;busy=true;
 try{const r=await fetch('data/election.json?t='+Date.now(),{cache:'no-store'});
  if(!r.ok)throw new Error(r.status===404?'no data yet, try again in a few minutes':'HTTP '+r.status);
  D=await r.json();try{localStorage.setItem('elec_v2',JSON.stringify(D))}catch(e){}
  if($('#list')){upd();fill()}else render();
 }catch(e){
  if(!D){try{D=JSON.parse(localStorage.getItem('elec_v2')||'null')}catch(_){}if(D)render()}
  if(D)$('#upd').textContent='Offline · showing saved results';
  else $('#main').innerHTML='<div class="card err">Could not load results ('+esc(e.message)+'). Check your connection and reopen the app.</div>';
 }finally{busy=false}}
nav();load();setInterval(()=>{if(!document.hidden)load()},120000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)load()});
})();
</script></body></html>
