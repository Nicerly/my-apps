<style>/*dm10*//*dm8*//*dm5*//*dm7*//*dm2*/
:root{--g:#00a142;--gd:#007a32;--bg:#f2f5f2;--card:#fff;--line:#e2e7e2;--fg:#1b1f1b;--mut:#687068}

#toast.on{opacity:1}
/*dm3*/.row{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}#sheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:30;display:none;align-items:flex-end}#sheet.on{display:flex}.sb{background:#fff;width:100%;border-radius:16px 16px 0 0;padding:14px 12px calc(env(safe-area-inset-bottom,0px) + 14px)}.st{font-weight:600;margin:0 4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sbtn{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#f6f8f6;border-radius:10px;padding:12px;font-size:16px;margin-top:6px;color:var(--fg)}.sbtn.on{background:#cdebd8;border-color:var(--g);font-weight:600}.sbtn.cx{text-align:center;color:#c33;background:#fff}
/*dm9*/.dt{display:inline-block;color:var(--gd);font-weight:600;padding:1px 7px;border-radius:6px;background:#e3f4e9;margin-right:2px}#psheet{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:31;display:none;align-items:flex-end}#psheet.on{display:flex}
</style></head><body>
<header><div class="top"><h1>DaglivsMat</h1><span id="st">Coop Daglivs · Fridhemsplan</span></div>
<div id="lists"></div>
<div id="sbar"><input id="q" type="text" placeholder="Sök bland Coops varor…" autocomplete="off" autocorrect="off" enterkeyhint="search"><button id="qx" aria-label="Rensa sökningen">×</button></div></header>
<main></main><div id="toast"></div><div id="sheet"></div><div id="psheet"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const FINE=["Frukt & grönt","Bröd & bageri","Kött & fågel","Chark & pålägg","Fisk & skaldjur","Mejeri & ägg","Ost","Vegetariskt","Färdigmat","Skafferi","Kryddor & bakning","Fryst","Dryck","Godis & snacks","Barn","Hälsa & hygien","Hushåll & städ","Djur","Hem & fritid","Kiosk & tobak","Upp"];const AREAS=["Upp", "Mejeri", "Veg", "Bak", "Fram"];const DEPT={"Skafferi": "Bak", "Kryddor & bakning": "Bak", "Dryck": "Upp", "Hushåll & städ": "Upp", "Hälsa & hygien": "Upp", "Barn": "Upp", "Djur": "Upp", "Hem & fritid": "Upp", "Övrigt": "Upp", "Mejeri & ägg": "Mejeri", "Ost": "Mejeri", "Frukt & grönt": "Veg", "Vegetariskt": "Veg", "Kött & fågel": "Bak", "Chark & pålägg": "Bak", "Fisk & skaldjur": "Bak", "Färdigmat": "Bak", "Fryst": "Fram", "Bröd & bageri": "Bak", "Godis & snacks": "Fram", "Kiosk & tobak": "Fram", "Upp": "Upp", "Mejeri": "Mejeri", "Veg": "Veg", "Bak": "Bak", "Fram": "Fram"};const OLDD={"Frukt, grönt & bröd": "Veg", "Kött, fisk & chark": "Bak", "Mejeri, ost & fryst": "Mejeri", "Skafferi, dryck & snacks": "Upp", "Hem & hygien": "Upp"};
function deptOf(c){const ch=chainNames(c),top=ch[0]||"",mid=ch[1]||"";if(/godis|snacks/i.test(top)){if(/chips|snacks|popcorn|nötter|ostbågar|dipp|salt/i.test(mid))return "Upp";return "Fram"}return DEPT[fineAreaOf(c)]||"Upp"}
function areaOf(c){const m=S&&S.cm;if(m&&m[c])return m[c];return deptOf(c)}
function reDept(){const B=new Map(P.map(p=>[p.id,p]));for(const l of S.lists)for(const it of l.items){const p=B.get(it.k);if(p&&!it.c)it.c=p.c;if(!it.mv&&it.c)it.a=(S.pm&&S.pm[it.k])||areaOf(it.c)}save()}
let LPT=null,LPF=false,LPX=0,LPY=0,MVI=-1;
function openMove(i){const it=cur().items[i];if(!it)return;MVI=i;const sh=$("#sheet");sh.innerHTML=`<div class="sb"><div class="st">Flytta ”${esc(it.n)}” till:</div>`+AREAS.map(a=>`<button class="sbtn${a===it.a?" on":""}" data-mv="${esc(a)}">${esc(a)}</button>`).join("")+`<button class="sbtn cx" data-mv="">Avbryt</button></div>`;sh.classList.add("on")}
function closeMove(){$("#sheet").classList.remove("on");MVI=-1}
document.addEventListener("pointerdown",e=>{LPF=false;const r=e.target.closest("main .row [data-act=tog]");if(!r||view!=="list"||Q.trim())return;const i=+r.dataset.i;LPX=e.clientX;LPY=e.clientY;clearTimeout(LPT);LPT=setTimeout(()=>{LPF=true;openMove(i)},550)});
["pointerup","pointercancel"].forEach(t=>document.addEventListener(t,()=>clearTimeout(LPT)));
document.addEventListener("pointermove",e=>{if(Math.abs(e.clientX-LPX)+Math.abs(e.clientY-LPY)>10)clearTimeout(LPT)});
document.addEventListener("click",e=>{if(LPF){LPF=false;e.stopImmediatePropagation();e.preventDefault();return}const sh=$("#sheet");if(!sh.classList.contains("on"))return;e.stopImmediatePropagation();const b=e.target.closest("[data-mv]");if(b&&b.dataset.mv){const it=cur().items[MVI];if(it){const a=b.dataset.mv;it.a=a;it.mv=true;if(it.c){S.cm=S.cm||{};S.cm[it.c]=a;for(const l of S.lists)for(const x of l.items)if(x.c===it.c&&!x.mv)x.a=a}save();toast(it.n+" → "+a)}}if(b||e.target===sh){closeMove();render()}},true);
const TOPM={"Frukt & Grönsaker":"Frukt & grönt","Bröd & Bageri":"Bröd & bageri","Kött, Fågel & Chark":"Kött & fågel","Fisk & Skaldjur":"Fisk & skaldjur","Mejeri & Ägg":"Mejeri & ägg","Ost":"Ost","Vegetariskt":"Vegetariskt","Färdigmat & Mellanmål":"Färdigmat","Delikatesser":"Ost","Skafferi":"Skafferi","Kryddor & Smaksättare":"Kryddor & bakning","Frys":"Fryst","Dryck":"Dryck","Godis, Glass & Snacks":"Godis & snacks","Barn":"Barn","Skönhet & Hygien":"Hälsa & hygien","Apotek, hälsa & tillskott":"Hälsa & hygien","Hushåll":"Hushåll & städ","Djurmat & Tillbehör":"Djur","Fritid":"Hem & fritid","Hem & inredning":"Hem & fritid","Kiosk & Tidningar":"Kiosk & tobak"};
const MIDM={"Kött, Fågel & Chark>Pålägg & Deli":"Chark & pålägg","Kött, Fågel & Chark>Korv":"Chark & pålägg","Kött, Fågel & Chark>Chark":"Chark & pålägg","Delikatesser>Delikatesschark":"Chark & pålägg","Godis, Glass & Snacks>Glass":"Fryst","Vegetariskt>Fryst":"Fryst","Skafferi>Bakning":"Kryddor & bakning"};
const STRONG=[[/fryst|frys/i,"Fryst"],[/barn|bebis/i,"Barn"],[/djur/i,"Djur"],[/hälsa|skönhet|hygien|apotek|kropp|rak|lödder|tvål|schampo/i,"Hälsa & hygien"],[/städ|tvätt|hushåll|papper|disk|rengör/i,"Hushåll & städ"],[/tobak|snus|kiosk|tidning/i,"Kiosk & tobak"],[/hem &|fritid|leksak|blomm|inredning/i,"Hem & fritid"]];
const WEAK=[[/frukt|grönt|grönsak/i,"Frukt & grönt"],[/bröd|bageri|kakor|bullar/i,"Bröd & bageri"],[/chark|pålägg|korv/i,"Chark & pålägg"],[/kött|fågel|kyckling/i,"Kött & fågel"],[/fisk|skaldjur/i,"Fisk & skaldjur"],[/mejeri|ägg|mjölk/i,"Mejeri & ägg"],[/^ost/i,"Ost"],[/vegetar|vego|växtbas/i,"Vegetariskt"],[/färdigmat|matlåd/i,"Färdigmat"],[/kryddor|bakning|smaksätt/i,"Kryddor & bakning"],[/skafferi|konserv|pasta/i,"Skafferi"],[/dryck|kaffe|juice/i,"Dryck"],[/godis|snacks|choklad|glass/i,"Godis & snacks"]];
let P=[],CATS={},IB="",CATERR=false,FOOT="",RES=[],view="list",Q="";
const AC={};
function chainNames(cid){const out=[];let c=cid,g=0;while(c&&CATS[c]&&g++<8){out.unshift(CATS[c][0]);c=CATS[c][1]}return out}
function fineAreaOf(cid){if(cid in AC)return AC[cid];const ch=chainNames(cid),top=ch[0]||"",mid=ch[1]||"",all=ch.join(" ");
 let a=MIDM[top+">"+mid]||TOPM[top]||null;
 if(!a)for(const[r,n]of STRONG)if(r.test(all)){a=n;break}
 if(!a)for(const[r,n]of WEAK)if(r.test(all)){a=n;break}
 return AC[cid]=a||"Upp"}
const LS="daglivsmat.v1";
let S;try{S=JSON.parse(localStorage.getItem(LS))||{}}catch(e){S={}}
if(!Array.isArray(S.lists)||!S.lists.length)S.lists=[{id:uid(),name:"Handla",items:[]}];
if(!S.lists.find(l=>l.id===S.cur))S.cur=S.lists[0].id;{const all=[],seen=new Map();for(const l of S.lists)for(const it of (l.items||[])){const x=seen.get(it.k);if(x){x.q=(x.q||1)+(it.q||1);x.d=!!(x.d&&it.d)}else{seen.set(it.k,it);all.push(it)}}S.lists=[{id:S.lists[0].id,name:"Inköpslista",items:all}];S.cur=S.lists[0].id}
if(!Array.isArray(S.order))S.order=AREAS.slice();
S.order=S.order.filter(a=>AREAS.includes(a));for(const a of AREAS)if(!S.order.includes(a))S.order.push(a);
for(const l of S.lists)for(const it of (l.items||[]))if(!AREAS.includes(it.a))it.a=OLDD[it.a]||DEPT[it.a]||"Upp";
const save=()=>{try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){toast("Kunde inte spara listan")}};
const cur=()=>S.lists.find(l=>l.id===S.cur);
const fmtP=x=>x==null?"":Number(x).toFixed(2).replace(".",",")+" kr";
function imgU(i){if(!i)return"";if(/^https?:/.test(i))return i.replace(/^http:/,"https:");return IB?IB+"w_96,h_96,c_pad,b_white,f_auto,q_auto/"+i:""}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),1400)}
function renderChips(){$("#lists").innerHTML=""}
function actions(){return `<div class="bar"><button class="btn" data-act="clr">Rensa avbockade</button><button class="btn" data-act="ord">Ordna områden</button></div><div class="foot">Tryck på avdelningen under en vara (t.ex. ”Bak ▾”) för att välja var den ska ligga. Appen kommer ihåg valet för den varan.</div><div class="foot">${esc(FOOT)}</div>`}
function itemRow(it,i){const sub=[it.b,it.s,it.p!=null?fmtP(it.p):""].filter(Boolean).join(" · ");
 return `<div class="row${it.d?" done":""}"><div class="ck" data-act="tog" data-i="${i}">${it.d?"✓":""}</div>${it.img?`<img class="th" loading="lazy" src="${esc(imgU(it.img))}" alt="">`:""}<div class="tx" data-act="tog" data-i="${i}"><div class="nm">${esc(it.n)}</div><div class="sub"><span class="dt" data-act="pickl" data-i="${i}">${esc(it.a)} ▾</span>${sub?" · "+esc(sub):""}</div></div><div class="qt"><button class="qb" data-act="dec" data-i="${i}" aria-label="Minska">−</button><span class="qn">${it.q}</span><button class="qb" data-act="inc" data-i="${i}" aria-label="Öka">+</button></div><button class="rm" data-act="rm" data-i="${i}" aria-label="Ta bort">×</button></div>`}
function renderList(){const L=cur();if(!L.items.length)return `<div class="empty">Inköpslistan är tom.<br>Sök efter varor ovan för att lägga till dem.</div>`+actions();
 const rk=a=>{const x=S.order.indexOf(a);return x<0?99:x};
 const g=L.items.map((it,i)=>[it,i]).sort((x,y)=>((+!!x[0].d)-(+!!y[0].d))||(rk(x[0].a)-rk(y[0].a))||(x[1]-y[1]));
 const tot=L.items.reduce((s,i)=>s+(i.p||0)*i.q,0),left=L.items.filter(i=>!i.d).length;
 return `<div class="tot">${left} av ${L.items.length} varor kvar${tot?" · ca "+fmtP(tot):""}</div><div class="card">`+g.map(([it,i])=>itemRow(it,i)).join("")+`</div>`+actions()}
const WC={};const WS=/[^a-zåäöéüæø0-9%]+/;
function catWords(cid){if(cid in WC)return WC[cid];return WC[cid]=chainNames(cid).join(" ").toLowerCase().split(WS).filter(Boolean)}
const NONFOOD=new Set(["Hälsa & hygien","Hushåll & städ","Djur","Hem & fritid","Kiosk & tobak"]);
function search(q){const t=q.toLowerCase().split(/\s+/).filter(Boolean);if(!t.length)return[];const t0=t[0],out=[];
 for(const p of P){let ok=true;for(const x of t)if(!p.k.includes(x)){ok=false;break}if(!ok)continue;
  const w=p.w||(p.w=p.n.toLowerCase().split(WS).filter(Boolean));
  let lv=3;for(let i=0;i<w.length;i++){const x=w[i];const l=x===t0?(i===0?0:0.4):x.endsWith(t0)?1:x.startsWith(t0)?2:3;if(l<lv)lv=l}
  const cm=catWords(p.c).some(x=>x===t0||(t0.length>=4&&x.endsWith(t0)));
  const s=lv+(cm?-1.5:0)+(!cm&&NONFOOD.has(fineAreaOf(p.c))?0.8:0);
  out.push([s*1000+Math.min(p.n.length,999),p])}
 out.sort((a,b)=>a[0]-b[0]);return out.slice(0,60).map(x=>x[1])}
function renderRes(){const L=cur();if(!P.length&&!CATERR)return `<div class="empty">Laddar Coops sortiment…</div>`;
 RES=search(Q);const inL=k=>L.items.find(i=>i.k===k);
 let h=`<div class="tot">${CATERR?"Coops sortiment kunde inte laddas":RES.length?(RES.length>=60?"Visar de 60 bästa träffarna":RES.length+" träffar"):"Inga träffar i Coops sortiment"} · läggs i inköpslistan</div><div class="card">`;
 h+=RES.map((p,j)=>{const x=inL(p.id);const sub=[p.b,p.s,p.p!=null?fmtP(p.p):""].filter(Boolean).join(" · ");
  return `<div class="row" data-act="add" data-j="${j}">${p.img?`<img class="th" loading="lazy" src="${esc(imgU(p.img))}" alt="">`:`<div class="th"></div>`}<div class="tx"><div class="nm">${esc(p.n)}</div><div class="sub">${esc(sub)}</div><div class="sub"><span class="dt" data-act="pick" data-j="${j}">${esc(pArea(p))} ▾</span></div></div><button class="add${x?" in":""}" data-act="add" data-j="${j}" aria-label="Lägg till">${x?"✓"+x.q:"+"}</button></div>`}).join("");
 h+=`<div class="row" data-act="custom"><div class="th" style="display:flex;align-items:center;justify-content:center;font-size:20px;background:none">✎</div><div class="tx"><div class="nm">Lägg till ”${esc(Q.trim())}”</div><div class="sub">som egen vara</div></div><button class="add" data-act="custom" aria-label="Lägg till egen vara">+</button></div></div>`;return h}
function renderOrd(){return `<div class="tot">Ordna områdena i den ordning du går genom butiken.</div><div class="card ord">`+S.order.map((a,i)=>`<div class="row"><div class="tx"><div class="nm">${i+1}. ${esc(a)}</div></div><button class="qb" data-act="up" data-i="${i}" aria-label="Flytta upp">↑</button><button class="qb" data-act="dn" data-i="${i}" aria-label="Flytta ner">↓</button></div>`).join("")+`</div><div class="bar"><button class="btn" data-act="ordok" style="background:var(--g);color:#fff;border-color:var(--g)">Klar</button><button class="btn" data-act="ordreset">Återställ</button></div>`}
function render(){renderChips();$("#qx").style.display=Q?"block":"none";$("main").innerHTML=Q.trim()?renderRes():view==="ord"?renderOrd():renderList()}
function addP(p){if(!p)return;const L=cur();const x=L.items.find(i=>i.k===p.id);if(x){x.q++;x.d=false}else L.items.push({k:p.id,n:p.n,b:p.b,s:p.s,p:p.p,img:imgU(p.img),a:pArea(p),c:p.c,mv:!!(S.pm&&S.pm[p.id]),q:1,d:false});save();toast("Lagt till: "+p.n);render()}
function addCustom(){const n=Q.trim();if(!n)return;const L=cur();L.items.push({k:"x:"+uid(),n:n.slice(0,60),b:"",s:"",p:null,img:"",a:RES[0]?areaOf(RES[0].c):"Upp",q:1,d:false});save();toast("Lagt till: "+n);$("#q").value="";Q="";render()}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el)return;const act=el.dataset.act,i=+el.dataset.i,L=cur();
 switch(act){case"sel":S.cur=el.dataset.id;view="list";break;
 case"newlist":{const n=prompt("Namn på den nya listan:","Ny lista");if(!n||!n.trim())return;const l={id:uid(),name:n.trim().slice(0,40),items:[]};S.lists.push(l);S.cur=l.id;view="list";break}
 case"ren":{const n=prompt("Nytt namn på listan:",L.name);if(!n||!n.trim())return;L.name=n.trim().slice(0,40);break}
 case"del":{if(!confirm(`Ta bort listan ”${L.name}”?`))return;S.lists=S.lists.filter(l=>l!==L);if(!S.lists.length)S.lists=[{id:uid(),name:"Handla",items:[]}];S.cur=S.lists[0].id;break}
 case"clr":L.items=L.items.filter(x=>!x.d);break;
 case"tog":L.items[i].d=!L.items[i].d;break;
 case"inc":L.items[i].q++;break;
 case"dec":if(L.items[i].q>1)L.items[i].q--;break;
 case"rm":L.items.splice(i,1);break;
 case"add":addP(RES[+el.dataset.j]);return;
 case"custom":addCustom();return;
 case"ord":view="ord";window.scrollTo(0,0);break;
 case"ordok":view="list";break;
 case"ordreset":S.order=AREAS.slice();break;
 case"up":if(i>0)[S.order[i-1],S.order[i]]=[S.order[i],S.order[i-1]];break;
 case"dn":if(i<S.order.length-1)[S.order[i+1],S.order[i]]=[S.order[i],S.order[i+1]];break;
 default:return}
 save();render()});
let tmr;$("#q").addEventListener("input",e=>{clearTimeout(tmr);tmr=setTimeout(()=>{Q=e.target.value;render();window.scrollTo(0,0)},150)});
$("#q").addEventListener("keydown",e=>{if(e.key==="Enter")e.target.blur()});

async function loadCat(){try{const r=await fetch("catalog.json",{cache:"no-cache"});if(!r.ok)throw new Error(r.status);const j=await r.json();
 CATS=j.cats||{};IB=(j.imgBase||"").replace(/^http:/,"https:");
 P=j.p.map(a=>({id:a[0],n:a[1],b:a[2]||"",s:a[3]||"",p:a[4],img:a[6]||"",c:a[7],k:(a[1]+" "+(a[2]||"")).toLowerCase()}));reDept();
 FOOT=`${P.length.toLocaleString("sv-SE")} varor och priser från Coop.se, uppdaterade ${new Date(j.built).toLocaleDateString("sv-SE")}. Priserna i butiken kan skilja sig.`}
 catch(e){CATERR=true;FOOT="Kunde inte ladda Coops sortiment just nu. Dina listor fungerar ändå."}
 window.__ready=true;render()}
window.__areaStats=()=>{const c={},o={};for(const p of P){const a=areaOf(p.c);c[a]=(c[a]||0)+1;if(a==="Upp"){const t=chainNames(p.c).slice(0,2).join(" > ");o[t]=(o[t]||0)+1}}
 const tops=Object.entries(CATS).filter(([k,v])=>!v[1]).map(([k,v])=>v[0]);
 const mids=Object.entries(CATS).filter(([k,v])=>v[1]&&CATS[v[1]]&&!CATS[v[1]][1]).map(([k,v])=>CATS[v[1]][0]+" > "+v[0]+" => "+areaOf(k));
 return {c,o,tops,mids}};
render();loadCat();

function pArea(p){const m=S.pm;return (m&&m[p.id])||areaOf(p.c)}
let PK=null;
function openPick(t){PK=t;const ca=t.it?t.it.a:pArea(t.p),nm=t.it?t.it.n:t.p.n,sh=$("#psheet");
 sh.innerHTML=`<div class="sb"><div class="st">Var ska ”${esc(nm)}” ligga?</div>`+AREAS.map(a=>`<button class="sbtn${a===ca?" on":""}" data-pk="${esc(a)}">${esc(a)}</button>`).join("")+`<button class="sbtn cx" data-pk="">Avbryt</button></div>`;sh.classList.add("on")}
document.addEventListener("click",e=>{const sh=$("#psheet");
 if(sh.classList.contains("on")){e.stopImmediatePropagation();e.preventDefault();const b=e.target.closest("[data-pk]");
  if(b&&b.dataset.pk&&PK){const a=b.dataset.pk,k=PK.it?PK.it.k:PK.p.id,n=PK.it?PK.it.n:PK.p.n;
   if(!/^x:/.test(k)){S.pm=S.pm||{};S.pm[k]=a}
   for(const l of S.lists)for(const x of l.items)if(x.k===k){x.a=a;x.mv=true}
   save();toast(n+" → "+a)}
  if(b||e.target===sh){sh.classList.remove("on");PK=null;render()}return}
 const el=e.target.closest("[data-act=pick],[data-act=pickl]");if(!el)return;e.stopImmediatePropagation();e.preventDefault();
 if(el.dataset.act==="pick"){const p=RES[+el.dataset.j];if(p)openPick({p})}else{const it=cur().items[+el.dataset.i];if(it)openPick({it})}},true);
